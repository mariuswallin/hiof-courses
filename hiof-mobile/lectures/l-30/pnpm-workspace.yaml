allowBuilds:
  msw: true
  unrs-resolver: true
overrides:
  lightningcss: 1.30.1
  # react-native-appwrite@0.32.0 depends on legacy expo-file-system@18; force the
  # SDK 56 version everywhere and point appwrite at expo-file-system/legacy via patch
  # so only one native module copy is linked.
  expo-file-system: 56.0.8
patchedDependencies:
  react-native-appwrite@0.32.0: patches/react-native-appwrite@0.32.0.patch
